name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
      PRIME_LLC: /usr/lib/llvm-21/bin/llc
      PRIME_CI_X11: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install LLVM 21 and native runtime development headers
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.asc"
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.asc" | awk -F: '$1=="fpr" {print $10; exit}')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/llvm.asc" /usr/share/keyrings/llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y lld-21 llvm-21-dev libasound2-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libwayland-dev pkg-config xvfb xauth
      - name: Install the repository toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: ./scripts/ci.sh
      - name: Install the packaged CLI and run a native consumer
        if: matrix.runner == 'ubuntu-24.04' || startsWith(github.ref, 'refs/tags/')
        run: ./scripts/package_candidate.sh
      - name: Verify minimum supported Rust
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          cargo +1.91.0 check --locked --all-targets
      - name: Exercise the embedded runtime on a simulated ESP32-C3 timer
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          rustup target add riscv32imc-unknown-none-elf
          python3 -m venv "$RUNNER_TEMP/prime-emulator"
          "$RUNNER_TEMP/prime-emulator/bin/pip" install unicorn==2.1.4
          PATH="/usr/lib/llvm-21/bin:$PATH" "$RUNNER_TEMP/prime-emulator/bin/python" scripts/test_embedded_timers.py
