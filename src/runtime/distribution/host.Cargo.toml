[package]
name = "runtime-abi"
version = "0.1.0"
edition = "2021"

[lib]
name = "runtime_abi"
path = "host.rs"
crate-type = ["staticlib"]

[features]
default = ["graphics", "audio"]
graphics = ["dep:image", "dep:minifb"]
audio = ["dep:rodio"]

[dependencies]
minifb = { version = "=0.29.0", optional = true }
image = { version = "=0.25.10", optional = true, default-features = false, features = ["png"] }
rodio = { version = "=0.17.3", optional = true }

[workspace]
