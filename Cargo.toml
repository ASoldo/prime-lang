[package]
name = "prime-lang"
version = "0.1.0"
description = "Prime language interpreter, LLVM compiler and language server"
repository = "https://github.com/ASoldo/prime-lang"
license = "MIT"
exclude = ["/workspace/demos/tetris/assets/"]
readme = "README.md"
edition = "2024"
rust-version = "1.91"

[features]
default = ["std-builtins"]
std-builtins = []

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.17"
llvm-sys = { version = "211.0.0", features = ["prefer-dynamic"] }
notify = "8.2.0"
tower-lsp-server = "0.23.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"
toml_edit = "0.23.7"
minifb = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
rodio = "0.17"
tempfile = "3.23.0"

[dev-dependencies]
insta = { version = "1.39.0", features = ["glob"] }
