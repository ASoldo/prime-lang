manifest_version = "3"

[package]
name = "demos::no_std_parity"
version = "0.1.0"

[module]
name = "demos::no_std_parity"
path = "main.prime"
visibility = "pub"
no_std = true

[modules]
record_bytes = { name = "record_bytes", path = "record_bytes.prime", visibility = "pub", no_std = true }
board_io = { name = "demos::esp32_board_io", path = "board_io.prime", visibility = "pub", no_std = true }
token_owners = { name = "demos::esp32_token_owners", path = "token_owners.prime", visibility = "pub", no_std = true }

[build]
# Classic ESP32 (Xtensa)
target = "xtensa-esp32-espidf"
platform = "esp32"

[build.runtime]
channel_slots = 12
channel_capacity = 12
task_slots = 12
recv_poll_ms = 2

[build.toolchain]
  cc = "xtensa-esp32-elf-gcc"
  ar = "xtensa-esp32-elf-ar"
  objcopy = "xtensa-esp32-elf-objcopy"
  esptool = "esptool"

  ld_script = "${IDF_BUILD_ROOT}/esp_system/ld/sections.ld"

  ld_flags = """-Wl,--gc-sections \
  -T${IDF_BUILD_ROOT}/esp_system/ld/memory.ld \
  -T${IDF_PATH}/components/esp_rom/esp32/ld/esp32.rom.ld \
  -T${IDF_PATH}/components/esp_rom/esp32/ld/esp32.rom.api.ld \
  -T${IDF_PATH}/components/esp_rom/esp32/ld/esp32.rom.libgcc.ld"""

[build.toolchain.env]
RUSTUP_TOOLCHAIN = "esp"

[build.flash]
enabled = false
port = "/dev/ttyUSB0"
baud = 460800
address = "0x10000"
